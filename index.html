<!DOCTYPE html>
<!-- GALERIA TAPIR — v16 -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tapir Media — Galería</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#131313">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg:#131313;
    --card:#1c1b1b;
    --border:#3a3939;
    --cyan:#00e5ff;
    --cyan-dim:rgba(0,229,255,.15);
    --text:#eaeaea;
    --text-muted:#8a8a86;
    --danger:#e24b4a;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background-color:var(--bg);
    background-image:
      radial-gradient(rgba(0,229,255,.05) 1px, transparent 1px),
      linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size: 18px 18px, 36px 36px, 36px 36px;
    color:var(--text);
    font-family:'Space Grotesk',system-ui,sans-serif;
    min-height:100vh;
  }
  .screen{ max-width:480px; margin:0 auto; padding:20px 16px 90px; min-height:100vh; }
  .hidden{ display:none !important; }
  .neon-border{ border:0.5px solid rgba(0,229,255,.35); box-shadow:0 0 10px rgba(0,229,255,.15), inset 0 0 10px rgba(0,229,255,.04); }

  /* LOGIN */
  .logo{ text-align:center; margin:40px 0 8px; }
  .logo img{ height:64px; }
  .ig{ text-align:center; font-size:13px; color:var(--cyan); letter-spacing:.5px; margin:0 0 32px; }
  input{
    width:100%; padding:14px; margin-bottom:12px; background:var(--card);
    border:0.5px solid var(--border); border-radius:8px; color:var(--text); font-size:15px;
  }
  input:focus{ outline:none; border-color:var(--cyan); }
  button{
    width:100%; padding:14px; background:var(--cyan); color:#062a2e; border:none;
    border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;
  }
  button:disabled{ opacity:.5; cursor:default; }
  .msg{ font-size:13px; color:var(--danger); margin-top:8px; text-align:center; }
  .opciones button{ background:var(--card); color:var(--text); border:0.5px solid var(--border);
                     margin-bottom:8px; text-align:left; }

  /* GALERIA */
  .top{ display:flex; flex-direction:column; align-items:center; margin-bottom:16px; }
  .top .logo{ margin:8px 0 4px; }
  .top .logo img{ height:40px; }
  .top-botones{ display:flex; gap:8px; width:100%; margin-top:12px; }
  .top-botones button{ flex:1; font-size:12px; padding:10px; display:flex; align-items:center;
                        justify-content:center; gap:6px; position:relative; }
  .top-botones svg{ width:14px; height:14px; stroke:var(--text); }
  .top-badge{ position:absolute; top:-5px; right:10px; background:var(--cyan); color:#062a2e;
              font-size:9px; min-width:14px; height:14px; border-radius:7px; display:flex;
              align-items:center; justify-content:center; padding:0 3px; font-weight:600; }
  .cliente{ margin:4px 0 16px; text-align:center; }
  .cliente .nombre{ font-size:15px; font-weight:600; margin:0 0 2px; }
  .cliente .evento{ font-size:12px; color:var(--text-muted); margin:0; }
  .selector-carpetas{ margin-top:10px; width:auto; max-width:260px; padding:8px 12px;
                       background:var(--card); border:0.5px solid var(--cyan); border-radius:8px;
                       color:var(--cyan); font-size:13px; font-family:inherit; }

  .mapa-cliente{ height:180px; border-radius:8px; margin-bottom:16px; border:0.5px solid var(--border);
                 overflow:hidden; }
  .marker-icono{ background:var(--bg); border:2px solid var(--cyan); border-radius:50%;
                  width:32px; height:32px; display:flex; align-items:center; justify-content:center;
                  box-shadow:0 0 10px rgba(0,229,255,.5); }
  .marker-icono svg{ width:16px; height:16px; stroke:var(--cyan); }
  .marker-icono.ambos svg{ width:13px; height:13px; }
  .leaflet-popup-content-wrapper{ background:var(--card); color:var(--text); border-radius:8px; }
  .leaflet-popup-tip{ background:var(--card); }
  .etiqueta-tramo{ background:rgba(19,19,19,.85); color:var(--cyan); border:0.5px solid rgba(0,229,255,.5);
                    border-radius:4px; font-size:10px; font-weight:600; padding:2px 6px;
                    box-shadow:none; text-shadow:0 0 6px rgba(0,229,255,.6); }
  .etiqueta-tramo::before{ display:none; }

  .lista-puntos{ margin-bottom:20px; }
  .punto-item{ display:flex; gap:10px; align-items:flex-start; background:var(--card);
               border:0.5px solid var(--border); border-radius:8px; padding:12px; margin-bottom:8px; }
  .punto-item .marker-icono{ width:28px; height:28px; flex-shrink:0; }
  .punto-item .marker-icono svg{ width:14px; height:14px; }
  .punto-item .tag{ color:var(--cyan); font-size:12px; font-weight:600; }
  .punto-item .desc{ font-size:13px; margin:2px 0 0; line-height:1.4; }
  .punto-item .fecha{ font-size:11px; color:var(--text-muted); margin-top:4px; }

  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:90px; }
  .thumb-cont{ display:flex; flex-direction:column; }
  .thumb{ position:relative; aspect-ratio:1; background:var(--card); border-radius:8px;
          border:0.5px solid var(--border); overflow:hidden; cursor:pointer; }
  .thumb-meta{ display:none; font-size:10px; color:var(--text-muted); padding:4px 2px 0; }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .3s; }
  .thumb img.cargada{ opacity:1; }
  .skeleton{ position:absolute; inset:0; background:linear-gradient(90deg, var(--card) 25%, #262524 50%, var(--card) 75%);
             background-size:200% 100%; animation:shimmer 1.4s infinite; }
  .skeleton.oculto{ display:none; }
  @keyframes shimmer{ 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .spinner{ display:inline-block; width:14px; height:14px; border:2px solid rgba(0,0,0,.25);
            border-top-color:#062a2e; border-radius:50%; animation:spin .7s linear infinite; }
  .badge-nueva{ position:absolute; top:4px; left:4px; background:var(--cyan-dim); color:var(--cyan);
                font-size:9px; font-weight:600; padding:2px 5px; border-radius:4px;
                border:0.5px solid rgba(0,229,255,.4); z-index:2; }
  .badge-video{ position:absolute; top:4px; right:4px; background:rgba(0,0,0,.6); color:#fff;
                font-size:10px; padding:2px 5px; border-radius:4px; z-index:2; }
  .thumb-acciones{ position:absolute; bottom:0; left:0; right:0; display:flex; gap:1px;
                    background:rgba(0,0,0,.55); backdrop-filter:blur(2px); }
  .thumb-acciones button{ flex:1; background:transparent; border:none; border-radius:0;
                           padding:6px 0; display:flex; align-items:center; justify-content:center; }
  .thumb-acciones button:active{ background:rgba(255,255,255,.1); }
  .thumb-acciones svg{ width:15px; height:15px; stroke:#fff; }
  .thumb-acciones .copiado svg{ stroke:var(--cyan); }

  /* NOTIFICACIONES / CONTACTO */
  .panel-avisos{ position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:60;
                 display:flex; align-items:flex-end; justify-content:center; }
  .panel-avisos-cont{ width:100%; max-width:480px; max-height:75vh; overflow-y:auto;
                       background:var(--bg); border-radius:16px 16px 0 0; border:0.5px solid var(--border);
                       padding:16px; }
  .panel-avisos h3{ font-size:15px; font-weight:600; margin:0 0 12px; color:var(--text); }
  .aviso{ background:var(--card); border:0.5px solid var(--border); border-radius:8px;
          padding:12px; margin-bottom:8px; }
  .aviso p{ margin:0; font-size:14px; line-height:1.5; }
  .aviso .fecha{ font-size:11px; color:var(--text-muted); margin-top:4px; }
  .contacto-fila{ display:flex; align-items:center; justify-content:space-between; gap:12px;
                   background:var(--card); border:0.5px solid var(--border); border-radius:8px;
                   padding:14px; margin-bottom:8px; }
  .contacto-fila p{ margin:0; font-size:14px; }
  .contacto-fila .label{ font-size:11px; color:var(--text-muted); margin-bottom:2px; }
  .contacto-fila button{ width:auto; padding:8px 12px; font-size:12px; }

  .barra-inferior{ position:fixed; bottom:0; left:0; right:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
                    background:linear-gradient(to top, var(--bg) 70%, transparent); }
  .barra-inferior button{ max-width:480px; margin:0 auto; display:flex; align-items:center;
                           justify-content:center; gap:8px; box-shadow:0 0 12px rgba(0,229,255,.3); }

  /* PREVIEW */
  .preview{ position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:50;
            display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; }
  .preview img, .preview video{ max-width:100%; max-height:75vh; border-radius:8px; opacity:0; transition:opacity .25s; }
  .preview img.cargada, .preview video.cargada{ opacity:1; }
  .preview .acciones{ display:flex; gap:12px; margin-top:16px; width:100%; max-width:400px; }
  .preview .acciones button{ flex:1; }
  .preview .cerrar{ position:absolute; top:16px; right:16px; background:none; border:none;
                     color:#fff; font-size:22px; width:auto; padding:8px; z-index:2; }
  .barra-carga{ position:absolute; top:0; left:0; right:0; height:3px; background:rgba(255,255,255,.1);
                overflow:hidden; }
  .barra-carga.hidden{ display:none; }
  .barra-carga::after{ content:''; position:absolute; top:0; left:-30%; width:30%; height:100%;
                        background:var(--cyan); animation:barraCarga 1s ease-in-out infinite; }
  @keyframes barraCarga{ 0%{ left:-30%; } 100%{ left:100%; } }
  .spinner-grande{ width:32px; height:32px; border:3px solid rgba(255,255,255,.15);
                    border-top-color:var(--cyan); border-radius:50%; animation:spin .7s linear infinite; }

  .empty{ text-align:center; color:var(--text-muted); font-size:13px; margin-top:60px; }

  /* MODO PC */
  @media (min-width:900px){
    .screen{ max-width:1100px; padding:32px 24px 90px; }
    .grid{ grid-template-columns:repeat(6,1fr); gap:14px; }
    .thumb-meta{ display:flex; justify-content:space-between; }
    .barra-inferior button{ max-width:300px; }
  }
</style>
</head>
<body>

<!-- PANTALLA LOGIN -->
<div id="pantallaLogin" class="screen">
  <div class="logo"><img src="logo_tapirmedia.svg" alt="Tapir Media"></div>
  <p class="ig">@tapirmedia</p>
  <input id="inNombre" placeholder="Nombre" autocomplete="given-name">
  <input id="inApellido" placeholder="Apellido" autocomplete="family-name">
  <button id="btnLogin">Entrar</button>
  <div id="loginMsg" class="msg"></div>
  <div id="opciones" class="opciones" style="margin-top:16px;"></div>
</div>

<!-- PANTALLA GALERIA -->
<div id="pantallaGaleria" class="screen hidden">
  <div class="top">
    <div class="logo"><img src="logo_tapirmedia.svg" alt="Tapir Media"></div>
    <p class="ig">@tapirmedia</p>
    <div class="top-botones">
      <button id="btnAvisos" class="neon-border">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Mensajes
        <span id="avisosBadge" class="top-badge hidden">0</span>
      </button>
      <button id="btnContacto" class="neon-border">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Contacto
      </button>
    </div>
  </div>
  <div class="cliente">
    <p class="nombre" id="clienteNombre"></p>
    <p class="evento" id="clienteEvento"></p>
    <select id="selectorCarpetas" class="selector-carpetas hidden"></select>
  </div>
  <div id="mapaCliente" class="mapa-cliente hidden"></div>
  <div id="listaPuntos" class="lista-puntos hidden"></div>
  <div id="grid" class="grid"></div>
  <div id="vacio" class="empty hidden">Todavía no hay material cargado. Volvé a chequear más tarde.</div>
  <div class="barra-inferior">
    <button id="btnDescargarTodo">Descargar todo</button>
  </div>
</div>

<!-- NOTIFICACIONES -->
<div id="panelAvisos" class="panel-avisos hidden">
  <div class="panel-avisos-cont">
    <h3>Mensajes</h3>
    <div id="listaAvisos"></div>
  </div>
</div>

<!-- CONTACTO -->
<div id="panelContacto" class="panel-avisos hidden">
  <div class="panel-avisos-cont">
    <h3>Contacto</h3>
    <div class="contacto-fila">
      <div>
        <div class="label">Nombre</div>
        <p>Lucas Martinez</p>
      </div>
    </div>
    <div class="contacto-fila">
      <div>
        <div class="label">Teléfono</div>
        <p>3513020815</p>
      </div>
      <button onclick="window.location.href='tel:3513020815'">Llamar</button>
    </div>
    <div class="contacto-fila">
      <div>
        <div class="label">Instagram</div>
        <p>@tapirmedia</p>
      </div>
      <button onclick="window.open('https://instagram.com/tapirmedia','_blank')">Abrir</button>
    </div>
  </div>
</div>

<!-- PREVIEW -->
<div id="preview" class="preview hidden">
  <div id="barraCarga" class="barra-carga hidden"></div>
  <button class="cerrar" id="btnCerrarPreview">&times;</button>
  <div id="previewMedia"></div>
  <div class="acciones">
    <button id="btnDescargarUno">Descargar</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@mapbox/togeojson@0.16.0/togeojson.js"></script>
<script>
// ================== CONFIG ==================
var APP_VERSION = 'v16';
var CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbzzBTWNHpsnJjArpGGW5v4ieMouTwWKVM5V4biTDmxZ_WJUJj4YhGSxSWmUZtP0pPl1/exec'
};

// ================== ESTADO ==================
var estado = {
  cliente: null,
  archivos: [],
  archivoActual: null,
  avisos: []
};

// ================== LOGIN ==================
document.getElementById('btnLogin').addEventListener('click', hacerLogin);

function hacerLogin() {
  var nombre = document.getElementById('inNombre').value.trim();
  var apellido = document.getElementById('inApellido').value.trim();
  var msg = document.getElementById('loginMsg');
  var btn = document.getElementById('btnLogin');
  msg.textContent = '';

  if (!nombre || !apellido) {
    msg.textContent = 'Completá nombre y apellido.';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  var url = CONFIG.API_URL + '?action=login&nombre=' + encodeURIComponent(nombre) +
            '&apellido=' + encodeURIComponent(apellido);

  fetch(url).then(function (r) { return r.json(); }).then(function (data) {
    if (data.status === 'ok') {
      entrarGaleria(data.cliente);
    } else if (data.status === 'ok_cm') {
      entrarComoCM(data.cm);
    } else if (data.status === 'multiple') {
      mostrarOpciones(data.opciones);
      btn.disabled = false;
      btn.textContent = 'Entrar';
    } else {
      msg.textContent = 'No encontramos tu carpeta. Revisá cómo lo escribiste.';
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  }).catch(function () {
    msg.textContent = 'No pudimos conectar. Probá de nuevo en un momento.';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  });
}

function mostrarOpciones(opciones) {
  var cont = document.getElementById('opciones');
  cont.innerHTML = '';
  opciones.forEach(function (o) {
    var b = document.createElement('button');
    b.textContent = 'Auto #' + o.numero_auto + ' · ' + o.evento;
    b.addEventListener('click', function () { entrarGaleria(o); });
    cont.appendChild(b);
  });
}

function entrarGaleria(cliente) {
  estado.cliente = cliente;
  estado.carpetas = [{ folder_id: cliente.folder_id, evento: cliente.evento, etiqueta: cliente.evento || 'Galería' }];
  estado.carpetaIndex = 0;
  localStorage.setItem('tapir_cliente', JSON.stringify(cliente));
  document.getElementById('pantallaLogin').classList.add('hidden');
  document.getElementById('pantallaGaleria').classList.remove('hidden');
  document.getElementById('clienteNombre').textContent = cliente.nombre + ' ' + cliente.apellido;
  document.getElementById('clienteEvento').textContent = cliente.evento || '';
  document.getElementById('selectorCarpetas').classList.add('hidden');
  cargarArchivos();
  cargarAvisos();
  cargarMapa();
}

function entrarComoCM(cm) {
  estado.esCM = true;
  estado.carpetas = cm.carpetas;
  estado.carpetaIndex = 0;
  var guardado = { esCM: true, nombre: cm.nombre, apellido: cm.apellido, carpetas: cm.carpetas };
  localStorage.setItem('tapir_cliente', JSON.stringify(guardado));
  document.getElementById('pantallaLogin').classList.add('hidden');
  document.getElementById('pantallaGaleria').classList.remove('hidden');
  document.getElementById('clienteNombre').textContent = cm.nombre + ' ' + cm.apellido;

  var selector = document.getElementById('selectorCarpetas');
  selector.innerHTML = '';
  cm.carpetas.forEach(function (c, i) {
    var opt = document.createElement('option');
    opt.value = i;
    opt.textContent = c.etiqueta;
    selector.appendChild(opt);
  });
  selector.classList.toggle('hidden', cm.carpetas.length <= 1);

  seleccionarCarpeta(0);
}

document.getElementById('selectorCarpetas').addEventListener('change', function () {
  seleccionarCarpeta(parseInt(this.value, 10));
});

function seleccionarCarpeta(index) {
  estado.carpetaIndex = index;
  var c = estado.carpetas[index];
  estado.cliente = { folder_id: c.folder_id, evento: c.evento };
  document.getElementById('clienteEvento').textContent = c.etiqueta || c.evento || '';

  // reseteamos el mapa, porque cambia de evento/recorrido
  if (mapaCliente) { mapaCliente.remove(); mapaCliente = null; }
  capaRutaCliente = null;
  capaMarcadoresCliente = null;
  primeraCargaMapa = true;

  cargarArchivos();
  cargarMapa();
}

// ================== GALERIA ==================
function cargarArchivos() {
  mostrarSkeleton();
  var url = CONFIG.API_URL + '?action=files&folder=' + encodeURIComponent(estado.cliente.folder_id);
  fetch(url).then(function (r) { return r.json(); }).then(function (data) {
    if (data.status !== 'ok') return;
    estado.archivos = data.archivos;
    renderGrid();
  });
}

function mostrarSkeleton() {
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (var i = 0; i < 9; i++) {
    var div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = '<div class="skeleton"></div>';
    grid.appendChild(div);
  }
}

function claveVisita() {
  return 'tapir_ultima_visita_' + estado.cliente.folder_id;
}

function formatearPeso(bytes) {
  if (!bytes) return '';
  if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function formatearHora(timestampMs) {
  if (!timestampMs) return '';
  var d = new Date(timestampMs);
  var hh = String(d.getHours()).padStart(2, '0');
  var mm = String(d.getMinutes()).padStart(2, '0');
  return hh + ':' + mm;
}

function renderGrid() {
  var grid = document.getElementById('grid');
  var vacio = document.getElementById('vacio');
  grid.innerHTML = '';

  if (estado.archivos.length === 0) {
    vacio.classList.remove('hidden');
    return;
  }
  vacio.classList.add('hidden');

  var ultimaVisita = parseInt(localStorage.getItem(claveVisita()) || '0', 10);

  var colaCarga = [];

  estado.archivos.forEach(function (a) {
    var cont = document.createElement('div');
    cont.className = 'thumb-cont';

    var div = document.createElement('div');
    div.className = 'thumb';

    var skeleton = document.createElement('div');
    skeleton.className = 'skeleton';
    div.appendChild(skeleton);

    var img = document.createElement('img');
    img.dataset.src = a.thumbnailUrl;
    div.appendChild(img);

    if (a.fechaCreacion > ultimaVisita) {
      var badge = document.createElement('span');
      badge.className = 'badge-nueva';
      badge.textContent = 'nueva';
      div.appendChild(badge);
    }
    if (a.esVideo) {
      var bv = document.createElement('span');
      bv.className = 'badge-video';
      bv.textContent = 'video';
      div.appendChild(bv);
    }

    var acciones = document.createElement('div');
    acciones.className = 'thumb-acciones';

    var btnDesc = document.createElement('button');
    btnDesc.setAttribute('aria-label', 'Descargar');
    btnDesc.innerHTML = ICONO_DESCARGAR;
    btnDesc.addEventListener('click', function (ev) {
      ev.stopPropagation();
      window.open(a.downloadUrl, '_blank');
    });
    acciones.appendChild(btnDesc);

    var btnLink = document.createElement('button');
    btnLink.setAttribute('aria-label', 'Copiar link');
    btnLink.innerHTML = ICONO_LINK;
    btnLink.addEventListener('click', function (ev) {
      ev.stopPropagation();
      navigator.clipboard.writeText(a.viewUrl).then(function () {
        btnLink.classList.add('copiado');
        setTimeout(function () { btnLink.classList.remove('copiado'); }, 1500);
      });
    });
    acciones.appendChild(btnLink);

    div.appendChild(acciones);

    div.addEventListener('click', function () { abrirPreview(a); });
    cont.appendChild(div);

    var meta = document.createElement('div');
    meta.className = 'thumb-meta';
    meta.innerHTML = '<span>' + formatearPeso(a.peso) + '</span><span>' + formatearHora(a.fechaCreacion) + '</span>';
    cont.appendChild(meta);

    grid.appendChild(cont);
    colaCarga.push(img);
  });

  // marcamos la visita DESPUES de pintar, asi el usuario alcanza a ver que era nuevo
  localStorage.setItem(claveVisita(), String(Date.now()));

  procesarCola(colaCarga);
}

function procesarCola(cola) {
  var CONCURRENCIA = 30; // CDN de Google, aguanta pedirlas todas casi juntas
  var indice = 0;

  function siguiente() {
    if (indice >= cola.length) return;
    var img = cola[indice++];
    img.src = img.dataset.src;
    img.addEventListener('load', function () {
      this.classList.add('cargada');
      this.previousElementSibling.classList.add('oculto');
      siguiente();
    });
    img.addEventListener('error', siguiente);
  }

  for (var i = 0; i < CONCURRENCIA; i++) siguiente();
}

// ================== PREVIEW ==================
function abrirPreview(archivo) {
  estado.archivoActual = archivo;
  var cont = document.getElementById('previewMedia');
  var barra = document.getElementById('barraCarga');
  cont.innerHTML = '<div class="spinner-grande"></div>';
  barra.classList.remove('hidden');
  document.getElementById('preview').classList.remove('hidden');

  if (archivo.esVideo) {
    var v = document.createElement('video');
    v.src = archivo.viewUrl;
    v.controls = true;
    v.autoplay = true;
    v.addEventListener('loadeddata', function () {
      cont.innerHTML = '';
      cont.appendChild(v);
      v.classList.add('cargada');
      barra.classList.add('hidden');
    });
  } else {
    var img = new Image();
    var intentoRespaldo = false;
    img.addEventListener('load', function () {
      cont.innerHTML = '';
      cont.appendChild(img);
      img.classList.add('cargada');
      barra.classList.add('hidden');
    });
    img.addEventListener('error', function () {
      if (!intentoRespaldo && archivo.thumbnailUrl) {
        // la vista en grande falló (típico de Drive con algunos archivos):
        // probamos con la miniatura, que sabemos que siempre carga
        intentoRespaldo = true;
        img.src = archivo.thumbnailUrl;
      } else {
        cont.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">No se pudo cargar la vista previa. Igual podés descargarla.</p>';
        barra.classList.add('hidden');
      }
    });
    img.src = archivo.previewUrl || archivo.viewUrl;
  }
}

// ================== MAPA (dónde está el equipo) ==================
var ICONO_CAMARA_FOTO = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
var ICONO_CAMARA_VIDEO = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>';

function iconoParaTipo(tipo) {
  if (tipo === 'video') return ICONO_CAMARA_VIDEO;
  if (tipo === 'ambos') return ICONO_CAMARA_FOTO + ICONO_CAMARA_VIDEO;
  return ICONO_CAMARA_FOTO;
}
function etiquetaParaTipo(tipo) {
  if (tipo === 'video') return 'Video';
  if (tipo === 'ambos') return 'Foto y Video';
  return 'Foto';
}
var mapaCliente = null;
var capaRutaCliente = null;
var capaMarcadoresCliente = null;
var primeraCargaMapa = true;

function tiempoRelativo(fechaTexto) {
  // fechaTexto viene como "dd/MM HH:mm" en hora local del script
  return fechaTexto || '';
}

function cargarMapa() {
  var evento = estado.cliente.evento;
  if (!evento) return;

  var urlUbicaciones = CONFIG.API_URL + '?action=ubicaciones&evento=' + encodeURIComponent(evento);
  var urlRuta = CONFIG.API_URL + '?action=ruta&evento=' + encodeURIComponent(evento);

  Promise.all([
    fetch(urlUbicaciones).then(function (r) { return r.json(); }),
    fetch(urlRuta).then(function (r) { return r.json(); })
  ]).then(function (resultados) {
    var datosUbicaciones = resultados[0];
    var datosRuta = resultados[1];
    var hayUbicaciones = datosUbicaciones.status === 'ok' && datosUbicaciones.ubicaciones.length > 0;
    var hayRuta = datosRuta.status === 'ok' && !!datosRuta.kml;

    if (!hayUbicaciones && !hayRuta) return;

    var cont = document.getElementById('mapaCliente');
    cont.classList.remove('hidden');

    if (!mapaCliente) {
      mapaCliente = L.map('mapaCliente', { zoomControl: false, attributionControl: false });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapaCliente);
    }

    // limpiamos lo que hubiera de una carga anterior, para no duplicar
    if (capaRutaCliente) { mapaCliente.removeLayer(capaRutaCliente); capaRutaCliente = null; }
    if (capaMarcadoresCliente) { mapaCliente.removeLayer(capaMarcadoresCliente); capaMarcadoresCliente = null; }

    var capaRuta = null;
    if (hayRuta) {
      var xml = new DOMParser().parseFromString(datosRuta.kml, 'text/xml');
      var geojson = toGeoJSON.kml(xml);
      var soloLineas = { filter: function (f) { return f.geometry && f.geometry.type.indexOf('LineString') > -1; } };
      var glow = L.geoJSON(geojson, Object.assign({ style: { color: '#00e5ff', weight: 11, opacity: .25 } }, soloLineas)).addTo(mapaCliente);
      var linea = L.geoJSON(geojson, Object.assign({
        style: { color: '#00e5ff', weight: 4, opacity: 1 },
        onEachFeature: function (feature, layer) {
          if (feature.properties && feature.properties.name) {
            layer.bindTooltip(feature.properties.name, {
              permanent: true, direction: 'center', className: 'etiqueta-tramo'
            });
          }
        }
      }, soloLineas)).addTo(mapaCliente);
      capaRuta = linea;
      capaRutaCliente = L.layerGroup([glow, linea]);
    }

    var puntos = [];
    var marcadoresPorId = {};
    if (hayUbicaciones) {
      var marcadores = [];
      datosUbicaciones.ubicaciones.forEach(function (u) {
        var icono = L.divIcon({
          className: '',
          html: '<div class="marker-icono' + (u.tipo === 'ambos' ? ' ambos' : '') + '">' + iconoParaTipo(u.tipo) + '</div>',
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });
        var m = L.marker([u.lat, u.lng], { icon: icono });
        var popupTexto = etiquetaParaTipo(u.tipo) + (u.descripcion ? ' — ' + u.descripcion : '') + '<br><small>' + u.fecha + '</small>';
        m.bindPopup(popupTexto);
        marcadores.push(m);
        marcadoresPorId[u.id] = m;
        puntos.push([u.lat, u.lng]);
      });
      capaMarcadoresCliente = L.layerGroup(marcadores).addTo(mapaCliente);
      renderListaPuntos(datosUbicaciones.ubicaciones, marcadoresPorId);
    }

    // el encuadre del mapa solo se ajusta la primera vez que hay datos;
    // en las actualizaciones automáticas siguientes no le movemos el mapa al usuario
    if (!primeraCargaMapa) return;
    primeraCargaMapa = false;

    if (puntos.length === 1 && !hayRuta) {
      setTimeout(function () {
        mapaCliente.invalidateSize();
        mapaCliente.setView(puntos[0], 15);
      }, 250);
    } else if (capaRuta) {
      var bounds = capaRuta.getBounds();
      puntos.forEach(function (p) { bounds.extend(p); });
      setTimeout(function () {
        mapaCliente.invalidateSize();
        mapaCliente.fitBounds(bounds, { padding: [30, 30] });
      }, 250);
    } else if (puntos.length > 1) {
      setTimeout(function () {
        mapaCliente.invalidateSize();
        mapaCliente.fitBounds(puntos, { padding: [30, 30] });
      }, 250);
    } else {
      setTimeout(function () { mapaCliente.invalidateSize(); }, 250);
    }
  });
}

// revisa cada 20 segundos si hay ubicaciones nuevas, sin recargar toda la pagina
setInterval(function () {
  if (estado.cliente) cargarMapa();
}, 20000);

function renderListaPuntos(ubicaciones, marcadoresPorId) {
  var cont = document.getElementById('listaPuntos');
  cont.innerHTML = '';
  if (!ubicaciones || ubicaciones.length === 0) {
    cont.classList.add('hidden');
    return;
  }
  cont.classList.remove('hidden');
  // más nuevo primero
  ubicaciones.slice().sort(function (a, b) { return b.timestamp - a.timestamp; }).forEach(function (u) {
    var div = document.createElement('div');
    div.className = 'punto-item';
    div.style.cursor = 'pointer';

    var iconoDiv = document.createElement('div');
    iconoDiv.className = 'marker-icono' + (u.tipo === 'ambos' ? ' ambos' : '');
    iconoDiv.innerHTML = iconoParaTipo(u.tipo);
    div.appendChild(iconoDiv);

    var textos = document.createElement('div');
    var tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = etiquetaParaTipo(u.tipo);
    textos.appendChild(tag);
    if (u.descripcion) {
      var desc = document.createElement('p');
      desc.className = 'desc';
      desc.textContent = u.descripcion;
      textos.appendChild(desc);
    }
    var fecha = document.createElement('div');
    fecha.className = 'fecha';
    fecha.textContent = u.fecha;
    textos.appendChild(fecha);
    div.appendChild(textos);

    div.addEventListener('click', function () {
      if (!mapaCliente) return;
      mapaCliente.setView([u.lat, u.lng], 16, { animate: true });
      document.getElementById('mapaCliente').scrollIntoView({ behavior: 'smooth', block: 'center' });
      var marcador = marcadoresPorId && marcadoresPorId[u.id];
      if (marcador) setTimeout(function () { marcador.openPopup(); }, 400);
    });

    cont.appendChild(div);
  });
}
