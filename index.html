<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tapir Media — Galería</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#131313">
<style>
  :root{
    --bg:#131313;
    --card:#1c1b1b;
    --border:#3a3939;
    --cyan:#00e5ff;
    --cyan-dim:rgba(0,229,255,.15);
    --text:#eaeaea;
    --text-muted:#8a8a86;
    --danger:#e24b4a;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',system-ui,sans-serif;
    min-height:100vh;
  }
  .screen{ max-width:480px; margin:0 auto; padding:20px 16px 90px; min-height:100vh; }
  .hidden{ display:none !important; }

  /* LOGIN */
  .logo{ color:var(--cyan); font-size:20px; font-weight:600; letter-spacing:2px; text-align:center;
         text-shadow:0 0 12px rgba(0,229,255,.35); margin:60px 0 40px; }
  input{
    width:100%; padding:14px; margin-bottom:12px; background:var(--card);
    border:0.5px solid var(--border); border-radius:8px; color:var(--text); font-size:15px;
  }
  input:focus{ outline:none; border-color:var(--cyan); }
  button{
    width:100%; padding:14px; background:var(--cyan); color:#062a2e; border:none;
    border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;
  }
  button:disabled{ opacity:.5; cursor:default; }
  .msg{ font-size:13px; color:var(--danger); margin-top:8px; text-align:center; }
  .opciones button{ background:var(--card); color:var(--text); border:0.5px solid var(--border);
                     margin-bottom:8px; text-align:left; }

  /* GALERIA */
  .top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .top .brand{ color:var(--cyan); font-size:14px; font-weight:600; letter-spacing:1px; }
  .cliente{ margin:12px 0 16px; }
  .cliente .nombre{ font-size:15px; font-weight:600; margin:0 0 2px; }
  .cliente .evento{ font-size:12px; color:var(--text-muted); margin:0; }

  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:90px; }
  .thumb{ position:relative; aspect-ratio:1; background:var(--card); border-radius:8px;
          border:0.5px solid var(--border); overflow:hidden; cursor:pointer; }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .badge-nueva{ position:absolute; top:4px; left:4px; background:var(--cyan-dim); color:var(--cyan);
                font-size:9px; font-weight:600; padding:2px 5px; border-radius:4px;
                border:0.5px solid rgba(0,229,255,.4); z-index:2; }
  .badge-video{ position:absolute; top:4px; right:4px; background:rgba(0,0,0,.6); color:#fff;
                font-size:10px; padding:2px 5px; border-radius:4px; z-index:2; }
  .thumb-acciones{ position:absolute; bottom:0; left:0; right:0; display:flex; gap:1px;
                    background:rgba(0,0,0,.55); backdrop-filter:blur(2px); }
  .thumb-acciones button{ flex:1; background:transparent; border:none; border-radius:0;
                           padding:6px 0; display:flex; align-items:center; justify-content:center; }
  .thumb-acciones button:active{ background:rgba(255,255,255,.1); }
  .thumb-acciones svg{ width:15px; height:15px; stroke:#fff; }
  .thumb-acciones .copiado svg{ stroke:var(--cyan); }

  /* NOTIFICACIONES */
  .bell{ position:relative; background:none; border:none; width:auto; padding:4px; }
  .bell svg{ width:20px; height:20px; stroke:var(--text); }
  .bell-badge{ position:absolute; top:0; right:0; background:var(--cyan); color:#062a2e;
               font-size:10px; min-width:15px; height:15px; border-radius:8px; display:flex;
               align-items:center; justify-content:center; padding:0 3px; font-weight:600; }
  .panel-avisos{ position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:60;
                 display:flex; align-items:flex-end; justify-content:center; }
  .panel-avisos-cont{ width:100%; max-width:480px; max-height:75vh; overflow-y:auto;
                       background:var(--bg); border-radius:16px 16px 0 0; border:0.5px solid var(--border);
                       padding:16px; }
  .panel-avisos h3{ font-size:15px; font-weight:600; margin:0 0 12px; color:var(--text); }
  .aviso{ background:var(--card); border:0.5px solid var(--border); border-radius:8px;
          padding:12px; margin-bottom:8px; }
  .aviso p{ margin:0; font-size:14px; line-height:1.5; }
  .aviso .fecha{ font-size:11px; color:var(--text-muted); margin-top:4px; }

  .barra-inferior{ position:fixed; bottom:0; left:0; right:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
                    background:linear-gradient(to top, var(--bg) 70%, transparent); }
  .barra-inferior button{ max-width:480px; margin:0 auto; display:flex; align-items:center;
                           justify-content:center; gap:8px; box-shadow:0 0 12px rgba(0,229,255,.3); }

  /* PREVIEW */
  .preview{ position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:50;
            display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; }
  .preview img, .preview video{ max-width:100%; max-height:75vh; border-radius:8px; }
  .preview .acciones{ display:flex; gap:12px; margin-top:16px; width:100%; max-width:400px; }
  .preview .acciones button{ flex:1; }
  .preview .cerrar{ position:absolute; top:16px; right:16px; background:none; border:none;
                     color:#fff; font-size:22px; width:auto; padding:8px; }

  .empty{ text-align:center; color:var(--text-muted); font-size:13px; margin-top:60px; }
</style>
</head>
<body>

<!-- PANTALLA LOGIN -->
<div id="pantallaLogin" class="screen">
  <div class="logo">TAPIR MEDIA</div>
  <input id="inNombre" placeholder="Nombre" autocomplete="given-name">
  <input id="inApellido" placeholder="Apellido" autocomplete="family-name">
  <button id="btnLogin">Entrar</button>
  <div id="loginMsg" class="msg"></div>
  <div id="opciones" class="opciones" style="margin-top:16px;"></div>
</div>

<!-- PANTALLA GALERIA -->
<div id="pantallaGaleria" class="screen hidden">
  <div class="top">
    <span class="brand">TAPIR MEDIA</span>
    <button class="bell" id="btnAvisos" aria-label="Notificaciones">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span id="avisosBadge" class="bell-badge hidden">0</span>
    </button>
  </div>
  <div class="cliente">
    <p class="nombre" id="clienteNombre"></p>
    <p class="evento" id="clienteEvento"></p>
  </div>
  <div id="grid" class="grid"></div>
  <div id="vacio" class="empty hidden">Todavía no hay material cargado. Volvé a chequear más tarde.</div>
  <div class="barra-inferior">
    <button id="btnDescargarTodo">Descargar todo</button>
  </div>
</div>

<!-- NOTIFICACIONES -->
<div id="panelAvisos" class="panel-avisos hidden">
  <div class="panel-avisos-cont">
    <h3>Notificaciones</h3>
    <div id="listaAvisos"></div>
  </div>
</div>

<!-- PREVIEW -->
<div id="preview" class="preview hidden">
  <button class="cerrar" id="btnCerrarPreview">&times;</button>
  <div id="previewMedia"></div>
  <div class="acciones">
    <button id="btnDescargarUno">Descargar</button>
  </div>
</div>

<script>
// ================== CONFIG ==================
var CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbzzBTWNHpsnJjArpGGW5v4ieMouTwWKVM5V4biTDmxZ_WJUJj4YhGSxSWmUZtP0pPl1/exec'
};

// ================== ESTADO ==================
var estado = {
  cliente: null,
  archivos: [],
  archivoActual: null,
  avisos: []
};

// ================== LOGIN ==================
document.getElementById('btnLogin').addEventListener('click', hacerLogin);

function hacerLogin() {
  var nombre = document.getElementById('inNombre').value.trim();
  var apellido = document.getElementById('inApellido').value.trim();
  var msg = document.getElementById('loginMsg');
  msg.textContent = '';

  if (!nombre || !apellido) {
    msg.textContent = 'Completá nombre y apellido.';
    return;
  }

  var url = CONFIG.API_URL + '?action=login&nombre=' + encodeURIComponent(nombre) +
            '&apellido=' + encodeURIComponent(apellido);

  fetch(url).then(function (r) { return r.json(); }).then(function (data) {
    if (data.status === 'ok') {
      entrarGaleria(data.cliente);
    } else if (data.status === 'multiple') {
      mostrarOpciones(data.opciones);
    } else {
      msg.textContent = 'No encontramos tu carpeta. Revisá cómo lo escribiste.';
    }
  }).catch(function () {
    msg.textContent = 'No pudimos conectar. Probá de nuevo en un momento.';
  });
}

function mostrarOpciones(opciones) {
  var cont = document.getElementById('opciones');
  cont.innerHTML = '';
  opciones.forEach(function (o) {
    var b = document.createElement('button');
    b.textContent = 'Auto #' + o.numero_auto + ' · ' + o.evento;
    b.addEventListener('click', function () { entrarGaleria(o); });
    cont.appendChild(b);
  });
}

function entrarGaleria(cliente) {
  estado.cliente = cliente;
  localStorage.setItem('tapir_cliente', JSON.stringify(cliente));
  document.getElementById('pantallaLogin').classList.add('hidden');
  document.getElementById('pantallaGaleria').classList.remove('hidden');
  document.getElementById('clienteNombre').textContent = cliente.nombre + ' ' + cliente.apellido;
  document.getElementById('clienteEvento').textContent = cliente.evento || '';
  cargarArchivos();
  cargarAvisos();
}

// ================== GALERIA ==================
function cargarArchivos() {
  var url = CONFIG.API_URL + '?action=files&folder=' + encodeURIComponent(estado.cliente.folder_id);
  fetch(url).then(function (r) { return r.json(); }).then(function (data) {
    if (data.status !== 'ok') return;
    estado.archivos = data.archivos;
    renderGrid();
  });
}

function claveVisita() {
  return 'tapir_ultima_visita_' + estado.cliente.folder_id;
}

function renderGrid() {
  var grid = document.getElementById('grid');
  var vacio = document.getElementById('vacio');
  grid.innerHTML = '';

  if (estado.archivos.length === 0) {
    vacio.classList.remove('hidden');
    return;
  }
  vacio.classList.add('hidden');

  var ultimaVisita = parseInt(localStorage.getItem(claveVisita()) || '0', 10);

  estado.archivos.forEach(function (a) {
    var div = document.createElement('div');
    div.className = 'thumb';

    var img = document.createElement('img');
    img.src = a.thumbnailUrl;
    img.loading = 'lazy';
    div.appendChild(img);

    if (a.fechaCreacion > ultimaVisita) {
      var badge = document.createElement('span');
      badge.className = 'badge-nueva';
      badge.textContent = 'nueva';
      div.appendChild(badge);
    }
    if (a.esVideo) {
      var bv = document.createElement('span');
      bv.className = 'badge-video';
      bv.textContent = 'video';
      div.appendChild(bv);
    }

    var acciones = document.createElement('div');
    acciones.className = 'thumb-acciones';

    var btnDesc = document.createElement('button');
    btnDesc.setAttribute('aria-label', 'Descargar');
    btnDesc.innerHTML = ICONO_DESCARGAR;
    btnDesc.addEventListener('click', function (ev) {
      ev.stopPropagation();
      window.open(a.downloadUrl, '_blank');
    });
    acciones.appendChild(btnDesc);

    var btnLink = document.createElement('button');
    btnLink.setAttribute('aria-label', 'Copiar link');
    btnLink.innerHTML = ICONO_LINK;
    btnLink.addEventListener('click', function (ev) {
      ev.stopPropagation();
      navigator.clipboard.writeText(a.viewUrl).then(function () {
        btnLink.classList.add('copiado');
        setTimeout(function () { btnLink.classList.remove('copiado'); }, 1500);
      });
    });
    acciones.appendChild(btnLink);

    div.appendChild(acciones);

    div.addEventListener('click', function () { abrirPreview(a); });
    grid.appendChild(div);
  });

  // marcamos la visita DESPUES de pintar, asi el usuario alcanza a ver que era nuevo
  localStorage.setItem(claveVisita(), String(Date.now()));
}

// ================== PREVIEW ==================
function abrirPreview(archivo) {
  estado.archivoActual = archivo;
  var cont = document.getElementById('previewMedia');
  cont.innerHTML = '';
  if (archivo.esVideo) {
    var v = document.createElement('video');
    v.src = archivo.viewUrl;
    v.controls = true;
    v.autoplay = true;
    cont.appendChild(v);
  } else {
    var img = document.createElement('img');
    img.src = archivo.viewUrl;
    cont.appendChild(img);
  }
  document.getElementById('preview').classList.remove('hidden');
}

document.getElementById('btnCerrarPreview').addEventListener('click', function () {
  document.getElementById('preview').classList.add('hidden');
});

document.getElementById('btnDescargarUno').addEventListener('click', function () {
  if (estado.archivoActual) window.location.href = estado.archivoActual.downloadUrl;
});

// ================== DESCARGA TOTAL ==================
document.getElementById('btnDescargarTodo').addEventListener('click', function () {
  var btn = this;
  btn.textContent = 'Armando el paquete...';
  btn.disabled = true;
  var url = CONFIG.API_URL + '?action=zip&folder=' + encodeURIComponent(estado.cliente.folder_id);
  window.location.href = url;
  setTimeout(function () {
    btn.textContent = 'Descargar todo';
    btn.disabled = false;
  }, 4000);
});

// ================== ICONOS ==================
var ICONO_DESCARGAR = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>';
var ICONO_LINK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6-6"/><path d="M11 6l1-1a4 4 0 0 1 6 6l-1 1"/><path d="M13 18l-1 1a4 4 0 0 1-6-6l1-1"/></svg>';

// ================== NOTIFICACIONES ==================
document.getElementById('btnAvisos').addEventListener('click', abrirAvisos);

function cargarAvisos() {
  var url = CONFIG.API_URL + '?action=avisos';
  fetch(url).then(function (r) { return r.json(); }).then(function (data) {
    if (data.status !== 'ok') return;
    estado.avisos = data.avisos;
    var vistos = parseInt(localStorage.getItem('tapir_avisos_vistos') || '0', 10);
    var nuevos = estado.avisos.length - vistos;
    var badge = document.getElementById('avisosBadge');
    if (nuevos > 0) {
      badge.textContent = String(nuevos);
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  });
}

function abrirAvisos() {
  var lista = document.getElementById('listaAvisos');
  lista.innerHTML = '';
  if (!estado.avisos || estado.avisos.length === 0) {
    lista.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">Todavía no hay avisos.</p>';
  } else {
    estado.avisos.slice().reverse().forEach(function (a) {
      var div = document.createElement('div');
      div.className = 'aviso';
      var p = document.createElement('p');
      p.textContent = a.mensaje;
      div.appendChild(p);
      if (a.fecha) {
        var f = document.createElement('div');
        f.className = 'fecha';
        f.textContent = a.fecha;
        div.appendChild(f);
      }
      lista.appendChild(div);
    });
  }
  document.getElementById('panelAvisos').classList.remove('hidden');
  localStorage.setItem('tapir_avisos_vistos', String(estado.avisos.length));
  document.getElementById('avisosBadge').classList.add('hidden');
}

document.getElementById('panelAvisos').addEventListener('click', function (ev) {
  if (ev.target.id === 'panelAvisos') ev.currentTarget.classList.add('hidden');
});

// ================== RECORDAR SESION ==================
(function () {
  var guardado = localStorage.getItem('tapir_cliente');
  if (guardado) entrarGaleria(JSON.parse(guardado));
})();
</script>
</body>
</html>
