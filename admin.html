<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tapir Media — Admin avisos</title>
<style>
  body{ margin:0; background:#131313; color:#eaeaea; font-family:'Space Grotesk',system-ui,sans-serif;
        min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .cont{ width:100%; max-width:400px; }
  .logo{ color:#00e5ff; font-size:16px; font-weight:600; letter-spacing:2px; text-align:center;
         margin-bottom:32px; text-shadow:0 0 12px rgba(0,229,255,.35); }
  label{ font-size:12px; color:#8a8a86; display:block; margin-bottom:6px; }
  input, textarea{ width:100%; padding:12px; margin-bottom:16px; background:#1c1b1b;
                    border:0.5px solid #3a3939; border-radius:8px; color:#eaeaea; font-size:15px;
                    font-family:inherit; box-sizing:border-box; }
  textarea{ resize:vertical; min-height:90px; }
  button{ width:100%; padding:14px; background:#00e5ff; color:#062a2e; border:none;
          border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  button:disabled{ opacity:.5; }
  .msg{ font-size:13px; text-align:center; margin-top:12px; }
  .ok{ color:#00e5ff; }
  .err{ color:#e24b4a; }
</style>
</head>
<body>
<div class="cont">
  <div class="logo">TAPIR MEDIA · ADMIN</div>
  <label for="inKey">Clave</label>
  <input type="password" id="inKey" autocomplete="off">
  <label for="inMensaje">Mensaje para todos los clientes</label>
  <textarea id="inMensaje" placeholder="Escribí el aviso..."></textarea>
  <button id="btnEnviar">Publicar aviso</button>
  <div id="msg" class="msg"></div>
</div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbzzBTWNHpsnJjArpGGW5v4ieMouTwWKVM5V4biTDmxZ_WJUJj4YhGSxSWmUZtP0pPl1/exec';

document.getElementById('btnEnviar').addEventListener('click', function () {
  var key = document.getElementById('inKey').value.trim();
  var mensaje = document.getElementById('inMensaje').value.trim();
  var msg = document.getElementById('msg');
  var btn = this;

  if (!key || !mensaje) {
    msg.textContent = 'Completá la clave y el mensaje.';
    msg.className = 'msg err';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Publicando...';

  var url = API_URL + '?action=nuevo_aviso&key=' + encodeURIComponent(key) +
            '&mensaje=' + encodeURIComponent(mensaje);

  fetch(url).then(function (r) { return r.json(); }).then(function (data) {
    btn.disabled = false;
    btn.textContent = 'Publicar aviso';
    if (data.status === 'ok') {
      msg.textContent = 'Aviso publicado. Ya está visible para todos.';
      msg.className = 'msg ok';
      document.getElementById('inMensaje').value = '';
    } else {
      msg.textContent = data.error || 'No se pudo publicar.';
      msg.className = 'msg err';
    }
  }).catch(function () {
    btn.disabled = false;
    btn.textContent = 'Publicar aviso';
    msg.textContent = 'No pudimos conectar. Probá de nuevo.';
    msg.className = 'msg err';
  });
});
</script>
</body>
</html>
